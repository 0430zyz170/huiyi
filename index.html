    function playTone(freq, duration, type, vol, sweepTo){
      try{
        const ctx = getCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);

        gain.gain.setValueAtTime(vol || 0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      }catch(e){}
    }

    // ---------- 工具函数 ----------
    function randomGlitchChar() {
      const chars = ['#', '@', '!', '?', '%', '&', '*', '×', '§', '¥', '€', '√', '∞', '♂', '♀', '☠', '✝', '☣'];
      return chars[Math.floor(Math.random() * chars.length)];
    }

    function showLoveOverlay(duration) {
      duration = duration || 2500;
      loveOverlay.innerHTML = '';
      loveOverlay.classList.add('active');
      const count = 60;
      for (let i = 0; i < count; i++) {
        const span = document.createElement('div');
        span.className = 'love-word';
        span.textContent = '我爱你';
        span.style.left = Math.random() * 95 + '%';
        span.style.top = Math.random() * 95 + '%';
        const rot = (Math.random() - 0.5) * 30;
        span.style.setProperty('--rot', rot + 'deg');
        const size = 1.2 + Math.random() * 3;
        span.style.fontSize = size + 'rem';
        span.style.animationDelay = (Math.random() * 0.5) + 's';
        span.style.animationDuration = (0.5 + Math.random() * 0.8) + 's';
        loveOverlay.appendChild(span);
      }
      setTimeout(function(){
        loveOverlay.classList.remove('active');
        loveOverlay.innerHTML = '';
      }, duration);
    }

    function startGlitch(duration) {
      if (isGlitching) return;
      isGlitching = true;
      gameContainer.classList.add('glitch');
      textArea.classList.add('unstable');
      const originalText = textArea.textContent;
      const glitchInterval = setInterval(function(){
        if (!isGlitching) { clearInterval(glitchInterval); return; }
        const chars = originalText.split('');
        for (let i = 0; i < chars.length; i++) {
          if (Math.random() > 0.7 && chars[i] !== '\n' && chars[i] !== ' ') {
            chars[i] = randomGlitchChar();
          }
        }
        textArea.textContent = chars.join('');
      }, 80);
      setTimeout(function(){
        clearInterval(glitchInterval);
        isGlitching = false;
        gameContainer.classList.remove('glitch');
        textArea.classList.remove('unstable');
        textArea.textContent = originalText;
      }, duration || 2000);
    }

    function updateSignalDisplay() {
      const bars = signalStrength.querySelectorAll('span');
      const activeCount = Math.max(1, Math.floor(signalStability / 20));
      bars.forEach(function(bar, index){
        if (index < activeCount) bar.classList.add('active');
        else bar.classList.remove('active');
      });
    }

    function degradeSignal(amount) {
      amount = amount || 8;
      signalStability = Math.max(5, signalStability - amount);
      updateSignalDisplay();
      if (!isGlitching && Math.random() < 0.5) {
        startGlitch(800 + Math.random() * 1800);
      }
      if (signalStability < 30 && !isGlitching && Math.random() < 0.8) {
        startGlitch(1500 + Math.random() * 2500);
      }
    }

    // ---------- 渲染章节 ----------
    function renderChapter(index) {
      const chapter = story[index];
      if (!chapter) return;

      chapterMarker.textContent = 'CHAPTER ' + index;

      if (index > 0) {
        degradeSignal(6 + Math.floor(Math.random() * 10));
      }

      let displayText = chapter.text;
      if (chapter.unstableText && isGlitching) {
        displayText = chapter.unstableText;
      }
      textArea.textContent = displayText;

      optionsContainer.innerHTML = '';
      chapter.options.forEach(function(opt){
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt.label;
        btn.addEventListener('click', function(){
          if (Math.random() < 0.4 && !isGlitching) startGlitch(1200);
          if (opt.next !== undefined && opt.next !== null) {
            currentChapter = opt.next;
            if (currentChapter === 20 || currentChapter === 21 || currentChapter === 22 || currentChapter === 300) {
              showLoveOverlay(3000);
            }
            if (Math.random() < 0.15 && currentChapter > 5 && currentChapter !== 300) {
              showLoveOverlay(1500);
            }
            renderChapter(currentChapter);
          }
        });
        optionsContainer.appendChild(btn);
      });

      if (index >= 20) {
        if (glitchTimer) clearInterval(glitchTimer);
        glitchTimer = setInterval(function(){
          if (!isGlitching) startGlitch(1000 + Math.random() * 2000);
        }, 6000);
      } else {
        if (glitchTimer) { clearInterval(glitchTimer); glitchTimer = null; }
      }

      if (Math.random() < 0.3 && index > 3) showLoveOverlay(1200);

      if (index === 300) {
        showLoveOverlay(5000);
      }
    }

    // ---------- 玩家档案 ----------
    const profile = { name: '未命名', avatar: null };
    const avatarDisplay = document.getElementById('avatarDisplay');
    const playerNameEl = document.getElementById('playerName');
    const editModal = document.getElementById('editModal');
    const nameInput = document.getElementById('nameInput');
    const avatarInput = document.getElementById('avatarInput');

    function updateProfileUI() {
      playerNameEl.textContent = profile.name || '未命名';
      if (profile.avatar) {
        avatarDisplay.style.backgroundImage = 'url(' + profile.avatar + ')';
        avatarDisplay.textContent = '';
      } else {
        avatarDisplay.style.backgroundImage = 'none';
        avatarDisplay.textContent = (profile.name || '?').charAt(0).toUpperCase();
      }
    }

    document.getElementById('editProfileBtn').addEventListener('click', function(){
      if (window.SFX) SFX.click();
      nameInput.value = profile.name;
      avatarInput.value = '';
      editModal.style.display = 'flex';
    });
    document.getElementById('cancelEdit').addEventListener('click', function(){
      if (window.SFX) SFX.click();
      editModal.style.display = 'none';
    });
    document.getElementById('confirmEdit').addEventListener('click', function(){
      if (window.SFX) SFX.click();
      profile.name = nameInput.value.trim() || '未命名';
      const file = avatarInput.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e){
          profile.avatar = e.target.result;
          updateProfileUI();
          editModal.style.display = 'none';
          saveToStorage();
        };
        reader.readAsDataURL(file);
      } else {
        updateProfileUI();
        editModal.style.display = 'none';
        saveToStorage();
      }
    });

    // ---------- 存档 / 读档 ----------
    function saveToStorage() {
      const saveData = {
        profile: profile,
        chapter: currentChapter,
        signal: signalStability,
        timestamp: Date.now()
      };
      try { localStorage.setItem('huiyi_save', JSON.stringify(saveData)); } catch(e){}
    }

    document.getElementById('saveBtn').addEventListener('click', function(){
      if (window.SFX) SFX.save();
      saveToStorage();
      const btn = document.getElementById('saveBtn');
      const old = btn.textContent;
      btn.textContent = '已存';
      setTimeout(function(){ btn.textContent = old; }, 900);
    });

    document.getElementById('loadBtn').addEventListener('click', function(){
      if (window.SFX) SFX.load();
      try {
        const raw = localStorage.getItem('huiyi_save');
        if (!raw) {
          const btn = document.getElementById('loadBtn');
          const old = btn.textContent;
          btn.textContent = '无档';
          setTimeout(function(){ btn.textContent = old; }, 900);
          return;
        }
        const data = JSON.parse(raw);
        if (data.profile) {
          profile.name = data.profile.name || '未命名';
          profile.avatar = data.profile.avatar || null;
          updateProfileUI();
        }
        if (typeof data.chapter === 'number') {
          currentChapter = data.chapter;
          if (typeof data.signal === 'number') signalStability = data.signal;
          updateSignalDisplay();
          renderChapter(currentChapter);
        }
        const btn = document.getElementById('loadBtn');
        const old = btn.textContent;
        btn.textContent = '已读';
        setTimeout(function(){ btn.textContent = old; }, 900);
      } catch(e){}
    });

    // ---------- 雷达框 ----------
    const radarBox = document.getElementById('radarBox');
    const dotSelf = document.getElementById('dotSelf');
    const dotHim = document.getElementById('dotHim');
    const radarLabel = document.getElementById('radarLabel');
    let radarActive = false;
    let radarInterval = null;
    let himAngle = 0;
    const FIELD_W = 130;
    const FIELD_H = 80;

    function updateRadar() {
      const cx = FIELD_W / 2;
      const cy = FIELD_H / 2;
      const selfJitterX = (Math.random()-0.5) * 3;
      const selfJitterY = (Math.random()-0.5) * 3;
      dotSelf.style.left = 'calc(50% + ' + selfJitterX + 'px)';
      dotSelf.style.top = 'calc(50% + ' + selfJitterY + 'px)';

      himAngle += 0.03 + Math.random() * 0.04;
      const himDistance = 18 + Math.sin(Date.now() * 0.001) * 12 + Math.random() * 8;
      const hx = cx + Math.cos(himAngle) * himDistance;
      const hy = cy + Math.sin(himAngle) * himDistance;

      const distFromCenter = Math.sqrt((hx-cx)*(hx-cx) + (hy-cy)*(hy-cy));
      const maxDist = Math.min(FIELD_W, FIELD_H) / 2;
      const danger = 1 - (distFromCenter / maxDist);

      dotHim.style.left = hx + 'px';
      dotHim.style.top = hy + 'px';

      if (danger > 0.75) {
        radarBox.classList.add('danger');
        radarLabel.textContent = '他在你身后';
        radarLabel.style.color = '#f22';
      } else if (danger > 0.5) {
        radarBox.classList.remove('danger');
        radarLabel.textContent = '他靠近了';
        radarLabel.style.color = '#f66';
      } else {
        radarBox.classList.remove('danger');
        radarLabel.textContent = '信号搜索中…';
        radarLabel.style.color = '#a33';
      }
      const size = 8 + danger * 8;
      dotHim.style.width = size + 'px';
      dotHim.style.height = size + 'px';
    }

    function showRadar() {
      if (radarActive) return;
      radarActive = true;
      radarBox.style.display = 'block';
      if (window.SFX) SFX.glitch();
      if (radarInterval) clearInterval(radarInterval);
      radarInterval = setInterval(updateRadar, 120);
    }
    function hideRadar() {
      if (!radarActive) return;
      radarActive = false;
      radarBox.style.display = 'none';
      radarBox.classList.remove('danger');
      if (radarInterval) { clearInterval(radarInterval); radarInterval = null; }
    }

    // 监听剧情文本，检测“身后”
    const textObserver = new MutationObserver(function(){
      const txt = textArea.textContent || '';
      if (txt.indexOf('身后') >= 0 || txt.indexOf('在后面') >= 0 || txt.indexOf('背后') >= 0) {
        showRadar();
      } else if (radarActive) {
        setTimeout(function(){
          const nowTxt = textArea.textContent || '';
          if (nowTxt.indexOf('身后') < 0 && nowTxt.indexOf('背后') < 0 && nowTxt.indexOf('在后面') < 0) {
            hideRadar();
          }
        }, 4000);
      }
    });
    textObserver.observe(textArea, { childList:true, characterData:true, subtree:true });

    // 音效绑定
    document.addEventListener('mouseover', function(e){
      if (e.target.classList && e.target.classList.contains('option-btn') && window.SFX) SFX.hover();
    });
    document.addEventListener('click', function(e){
      if (e.target.classList && e.target.classList.contains('option-btn') && window.SFX) SFX.click();
    });

    // 全屏我爱你的音效
    const loveObserver = new MutationObserver(function(){
      if (loveOverlay.classList.contains('active') && window.SFX) SFX.love();
    });
    loveObserver.observe(loveOverlay, { attributes:true, attributeFilter:['class'] });

    // 信号不稳的音效
    let lastGlitch = false;
    const glitchObserver = new MutationObserver(function(){
      const nowGlitch = gameContainer.classList.contains('glitch');
      if (nowGlitch && !lastGlitch && window.SFX) SFX.glitch();
      lastGlitch = nowGlitch;
    });
    glitchObserver.observe(gameContainer, { attributes:true, attributeFilter:['class'] });

    // 初始化：读取上次档案
    try {
      const raw = localStorage.getItem('huiyi_save');
      if (raw) {
        const data = JSON.parse(raw);
        if (data.profile) {
          profile.name = data.profile.name || '未命名';
          profile.avatar = data.profile.avatar || null;
        }
      }
    } catch(e){}
    updateProfileUI();

    // 启动
    updateSignalDisplay();
    renderChapter(0);

  })();
  </script>
</body>
</html>
